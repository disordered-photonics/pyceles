repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: \.ipynb$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (src+examples+tests)
        args: [--config-file=pyproject.toml, src, examples, tests]
        pass_filenames: false
        # Keep these exact pins synchronized with the dev extra in pyproject.toml.
        # Mypy diagnostics depend on the installed scientific packages and stubs,
        # not only on the mypy executable itself.
        additional_dependencies:
          - numpy==2.5.2
          - scipy==1.18.1
          - scipy-stubs==1.18.1.0
          - matplotlib==3.11.1
          - h5py==3.16.0
          - tqdm==4.70.0
          - types-tqdm==4.70.0.20260827
          - pytest==9.1.1
