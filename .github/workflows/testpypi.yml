name: TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build TestPyPI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import importlib.metadata as metadata; import pyceles; assert pyceles.__version__ == metadata.version('pyceles')"

      - name: Upload TestPyPI distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-dists
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Configure a separate TestPyPI trusted publisher for this environment.
      name: testpypi
      url: https://test.pypi.org/p/pyceles
    permissions:
      id-token: write
    steps:
      - name: Download TestPyPI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-dists
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
