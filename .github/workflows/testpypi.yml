name: TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build TestPyPI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import importlib.metadata as metadata; import pyceles; assert pyceles.__version__ == metadata.version('pyceles')"

      - name: Upload TestPyPI distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-dists
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Configure a separate TestPyPI trusted publisher for this environment.
      name: testpypi
      url: https://test.pypi.org/p/pyceles
    permissions:
      id-token: write
    steps:
      - name: Download TestPyPI distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-dists
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
