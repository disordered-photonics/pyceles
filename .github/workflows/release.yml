name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check tag matches package version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import runpy; print(runpy.run_path("src/pyceles/_version.py")["__version__"])')"
          test "$actual" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $actual" >&2
            exit 1
          }

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python -c "import importlib.metadata as metadata; import pyceles; assert pyceles.__version__ == metadata.version('pyceles')"

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Configure this protected environment together with a PyPI trusted
      # publisher before enabling production releases.
      name: pypi
      url: https://pypi.org/p/pyceles
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
