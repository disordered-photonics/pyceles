[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyceles"
version = "0.2.0"
description = "Reference implementation of CELES-style many-sphere T-matrix scattering, with accelerator backends planned."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Lorenzo Pattelli" },
]
keywords = ["electromagnetics", "multiple-scattering", "t-matrix", "spherical-waves"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy~=2.4",
  "scipy~=1.17",
  "matplotlib~=3.10",
  "h5py~=3.15",
  "tqdm~=4.67",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "pre-commit>=4",
  "nbstripout>=0.8",
  "mypy>=1.11",
]
notebooks = [
  "jupyter",
  "ipykernel",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyceles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "outputs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E741", "E402", "E702", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
