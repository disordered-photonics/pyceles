[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyceles"
version = "0.3.0"
description = "Reference implementation of CELES-style many-particle T-matrix scattering with NumPy and CuPy backends."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Lorenzo Pattelli" },
]
keywords = ["electromagnetics", "multiple-scattering", "t-matrix", "spherical-waves"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy~=2.4",
  "scipy~=1.17",
  "matplotlib~=3.10",
  "h5py~=3.15",
  "tqdm~=4.67",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "ruff>=0.9",
  "pre-commit>=4",
  "nbstripout>=0.8",
  "mypy>=1.11",
]
notebooks = [
  "jupyter",
  "ipykernel",
]
cupy = [
  "cupy>=14",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyceles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: fast isolated checks for core algorithms and public helpers",
  "physics: physically meaningful end-to-end or invariant-oriented checks",
  "regression: locked regression coverage for shipped behavior and reference cases",
  "io: persistence, workflow, and plotting-facing tests",
  "gpu: requires CuPy and a working CUDA runtime/device",
  "fake_gpu: exercises CuPy-facing dispatch paths without a real CUDA runtime",
  "slow: longer-running coverage kept out of the default fast gate",
  "filesystem: writes files or directories under pytest-managed temporary roots",
  "hdf5: reads or writes HDF5 payloads",
  "reference: compares against independent formulas, fixed oracle data, or external references",
  "api_contract: protects public API shape, validation, or callable/source contracts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "outputs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "NPY"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/io/test_plotting_helpers.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
exclude_gitignore = true

[[tool.mypy.overrides]]
module = ["cupy", "cupy.*", "cupyx", "cupyx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
