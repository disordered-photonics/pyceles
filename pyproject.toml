[build-system]
requires = ["setuptools>=84", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "pyceles"
version = "0.5.0"
description = "CELES-style many-particle T-matrix scattering with a NumPy/SciPy reference path and optional CuPy acceleration."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Pattelli" }]
keywords = [
  "computational-electromagnetics",
  "multiple-scattering",
  "t-matrix",
  "spherical-waves",
  "nanophotonics",
  "cuda",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy~=2.5",
  "scipy~=1.18",
  "matplotlib~=3.11",
  "h5py~=3.16",
  "tqdm~=4.70",
]

[project.urls]
Homepage = "https://github.com/disordered-photonics/pyceles"
Repository = "https://github.com/disordered-photonics/pyceles"
Issues = "https://github.com/disordered-photonics/pyceles/issues"
Documentation = "https://github.com/disordered-photonics/pyceles/tree/main/docs"

[project.optional-dependencies]
# Exact contributor-tool pins intentionally mirror the isolated pre-commit
# environments. Runtime requirements above remain library-friendly ranges.
dev = [
  "numpy==2.5.2",
  "scipy==1.18.1",
  "scipy-stubs==1.18.1.0",
  "matplotlib==3.11.1",
  "h5py==3.16.0",
  "tqdm==4.70.0",
  "types-tqdm==4.70.0.20260827",
  "pytest==9.1.1",
  "ruff==0.16.5",
  "pre-commit==4.6.2",
  "nbstripout==0.9.1",
  "mypy==2.3.1",
]
notebooks = [
  "jupyter",
  "ipykernel",
]
cupy = [
  "cupy>=14.2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyceles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: fast isolated checks for core algorithms and public helpers",
  "physics: physically meaningful end-to-end or invariant-oriented checks",
  "regression: locked regression coverage for shipped behavior and reference cases",
  "io: persistence, workflow, and plotting-facing tests",
  "gpu: requires CuPy and a working CUDA runtime/device",
  "fake_gpu: exercises CuPy-facing dispatch with controlled doubles and no CUDA runtime",
  "slow: longer-running coverage kept out of the default fast gate",
  "filesystem: writes files or directories under pytest-managed temporary roots",
  "hdf5: reads or writes HDF5 payloads",
  "reference: compares against independent formulas, fixed oracle data, or external references",
  "api_contract: protects public API shape, validation, or callable/source contracts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "outputs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "NPY"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/io/test_plotting_helpers.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
exclude_gitignore = true

[[tool.mypy.overrides]]
module = ["cupy", "cupy.*", "cupyx", "cupyx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
